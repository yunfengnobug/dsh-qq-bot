url: https://github.com/yunfengnobug/dsh-qq-bot
name: yunfengnobug/dsh-qq-bot
category: notify
description:
  en: DSH plugin (fork of sj244/dsh-qq-bridge) that connects DSH sessions to QQ through OneBot/NapCat. Fail-closed whitelist; @-mention, nickname and configurable-probability wake. Cordis id remains qq-bridge.
  zh: DSH 插件（fork 自 sj244/dsh-qq-bridge），把 DSH 会话接到 QQ（OneBot/NapCat）。白名单 fail-closed，@ 与昵称必唤醒。Cordis 插件 id 仍是 qq-bridge。
